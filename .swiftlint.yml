# SwiftPM generates a test runner under .build with its own style; linting it reports violations
# in code nobody wrote and nobody can fix.
excluded:
  - .build

included:
  - Sources
  - Tests

line_length:
  warning: 110
  error: 140
  ignores_urls: true

identifier_name:
  min_length: 3
  excluded: [id, up, to, at, on]

cyclomatic_complexity:
  # `StatusEngine.advance` is a flat sequence of independent transition checks; splitting it to
  # satisfy a threshold would scatter one readable state machine across helpers.
  warning: 12
  error: 20

type_body_length:
  warning: 300
  error: 400

file_length:
  warning: 400
  error: 600

disabled_rules:
  # Trailing closures read worse than a labelled argument in SwiftUI builders.
  - multiple_closures_with_trailing_closure

  # Trailing commas in multi-line literals keep diffs to one line when an element is appended.
  - trailing_comma

  # Misfires on a `guard`/`while` whose condition is wrapped across lines, which is most of the
  # multi-clause guards in this codebase.
  - opening_brace

# `inout_parameter` used to sit above, to excuse the `inout` scratch variables CoreMediaIO and
# CoreAudio property getters take. SwiftLint has no such rule — so it suppressed nothing, and
# every run answered with a warning plus all 225 valid rule identifiers, which is what buried the
# real violations in `make lint`'s output. Removed rather than renamed: with it gone the strict
# run is still clean, so whatever it was meant to excuse was never being flagged.
